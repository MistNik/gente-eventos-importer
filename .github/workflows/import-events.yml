name: Importar eventos

on:
  workflow_dispatch:   # <--- ESTA LÍNEA HABILITA EL BOTÓN MANUAL
  schedule:
    - cron: '0 3 * * *' # (Si tienes una ejecución programada)

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - run: npm run import
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}